name: TestPyPI release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testpypi-release
  cancel-in-progress: false

env:
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: SOULS-TAMU/Ohagi/.github/actions/release-check@0bec7e86f5e26a2afa0ae8326aaf252cff2fe50c
        with:
          publishing: 'true'
          index: testpypi
      - run: python -m pip install --upgrade build twine
      - id: metadata
        run: |
          python -c 'import os,tomllib; p=tomllib.load(open("pyproject.toml","rb"))["project"]; open(os.environ["GITHUB_OUTPUT"],"a").write("version="+p["version"]+"\n")'
      - name: Build sdist and wheel from the sdist
        run: python .github/scripts/testpypi_build.py
      - run: python -m twine check --strict dist/*
      - uses: SOULS-TAMU/Ohagi/.github/actions/release-check@0bec7e86f5e26a2afa0ae8326aaf252cff2fe50c
        with:
          index: testpypi
          artifact-directory: dist
          tag: v${{ steps.metadata.outputs.version }}
      - name: Check installed candidate before upload
        uses: SOULS-TAMU/Ohagi/.github/actions/package-check@bdd278e9633990e879c5fdefc0c4da2fa5d47298
        with:
          version: "${{ steps.metadata.outputs.version }}"
          index: testpypi
          local-directory: dist
          smoke-distribution: kkthn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/kkthn/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-distributions
          path: dist
      - name: Publish exclusively to TestPyPI with OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  installed:
    needs: [build, publish]
    name: TestPyPI install / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install published stack wheels and run real examples
        uses: SOULS-TAMU/Ohagi/.github/actions/package-check@bdd278e9633990e879c5fdefc0c4da2fa5d47298
        with:
          version: "${{ needs.build.outputs.version }}"
          index: testpypi
          smoke-distribution: kkthn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: install-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            package-install-results.json
            package-smoke-results.json
          if-no-files-found: error
