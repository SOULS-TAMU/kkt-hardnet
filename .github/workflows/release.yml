name: PyPI release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

env:
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build twine
      - id: metadata
        run: |
          python -c 'import os,tomllib; p=tomllib.load(open("pyproject.toml","rb"))["project"]; open(os.environ["GITHUB_OUTPUT"],"a").write("version="+p["version"]+"\n")'
      - name: Build sdist and wheel from the sdist
        run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check installed candidate before upload
        run: |
          python .github/scripts/package_install.py --version "${{ steps.metadata.outputs.version }}" --local-dir dist
          python .github/scripts/package_smoke.py --version "${{ steps.metadata.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  candidate-python315:
    needs: build
    name: Candidate Python 3.15 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-distributions
          path: dist
      - name: Verify the candidate wheel before upload
        run: |
          python -m pip install --upgrade pip
          python .github/scripts/package_install.py --version "${{ needs.build.outputs.version }}" --local-dir dist
          python .github/scripts/package_smoke.py --version "${{ needs.build.outputs.version }}"

  publish:
    needs: [build, candidate-python315]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/kkt-hardnet/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-distributions
          path: dist
      - name: Publish verified distributions to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://upload.pypi.org/legacy/
          print-hash: true

  installed:
    needs: [build, publish]
    name: PyPI install / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - os: ubuntu-24.04-arm
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install published stack wheels and run real examples
        run: |
          python -m pip install --upgrade pip
          python .github/scripts/package_install.py --version "${{ needs.build.outputs.version }}"
          python .github/scripts/package_smoke.py --version "${{ needs.build.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: install-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            package-install-results.json
            package-smoke-results.json
          if-no-files-found: error
