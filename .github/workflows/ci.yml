name: CI
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  JAX_PLATFORMS: cpu
  JAX_ENABLE_X64: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  MPLBACKEND: Agg
defaults:
  run:
    shell: bash
jobs:
  quality:
    name: Ruff and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: python -m ruff format --check src tests .github/scripts
      - run: python -m ruff check --select F,E9 src tests .github/scripts
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / JAX ${{ matrix.jax }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PIP_CONSTRAINT: ${{ matrix.jax == 'baseline' && format('{0}/.github/constraints/jax-baseline.txt', github.workspace) || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        jax: [current]
        include:
          - os: ubuntu-latest
            python: '3.12'
            jax: baseline
          - os: windows-latest
            python: '3.12'
            jax: baseline
          - os: macos-latest
            python: '3.12'
            jax: baseline
          - os: ubuntu-24.04-arm
            python: '3.13'
            jax: current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned shared engine and candidate
        run: |
          python -m pip install "purin @ git+https://github.com/SOULS-TAMU/Purin.git@9ab708b470c4d9359e57f7bd214b0b5515aa4115"
          python -m pip install "ohagi[plotting] @ git+https://github.com/SOULS-TAMU/Ohagi.git@e28f687e840d6840b259e687323029c3cc49bd59"
          python -m pip install ".[dev]" pytest-cov
          python -m pip check
      - run: python .github/scripts/environment.py
      - run: python -m pytest -q -m "not optional"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: environment-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.jax }}
          path: ci-environment.json
  full-coverage:
    name: Full frontend statement and branch coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned shared engine and candidate
        run: |
          python -m pip install "purin @ git+https://github.com/SOULS-TAMU/Purin.git@9ab708b470c4d9359e57f7bd214b0b5515aa4115"
          python -m pip install "ohagi[flax,orbax,optax,plotting] @ git+https://github.com/SOULS-TAMU/Ohagi.git@e28f687e840d6840b259e687323029c3cc49bd59"
          python -m pip install ".[dev]" pytest-cov
          python -m pip check
      - run: python -m pytest -q --cov=kkthn --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error
  package:
    name: Build and install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned shared engine and candidate
        run: |
          python -m pip install "purin @ git+https://github.com/SOULS-TAMU/Purin.git@9ab708b470c4d9359e57f7bd214b0b5515aa4115"
          python -m pip install "ohagi[plotting] @ git+https://github.com/SOULS-TAMU/Ohagi.git@e28f687e840d6840b259e687323029c3cc49bd59"
          python -m pip install ".[dev]" pytest-cov
          python -m pip check
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -I -c "import kkthn; from importlib.metadata import version; assert version('kkt-hardnet')"
      - run: python -m pip check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: distributions-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
  optional:
    name: Flax and Orbax / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Enable long paths for checkpoint dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1
      - name: Install pinned shared engine and candidate
        run: |
          python -m pip install "purin @ git+https://github.com/SOULS-TAMU/Purin.git@9ab708b470c4d9359e57f7bd214b0b5515aa4115"
          python -m pip install "ohagi[flax,orbax,optax,plotting] @ git+https://github.com/SOULS-TAMU/Ohagi.git@e28f687e840d6840b259e687323029c3cc49bd59"
          python -m pip install ".[dev]" pytest-cov
          python -m pip check
      - run: python -m pytest tests/test_optional.py -q
  coverage:
    name: Publish measured development coverage
    needs: [quality, tests, full-coverage, package, optional]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: coverage
          path: coverage-input
      - run: python .github/scripts/coverage_report.py coverage-input/coverage.json coverage-site
      - uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: codex/coverage-development
          publish_dir: coverage-site
          commit_message: Update development coverage
